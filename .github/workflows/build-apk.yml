
name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Locate project (repo root or inside ZIP)
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            echo "Project found in repo root."
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          ZIP=""
          for z in ./*.zip; do
            [ -f "$z" ] || continue
            LIST="$(unzip -Z1 "$z" || true)"

            if grep -qE '(^|/)gradlew$' <<< "$LIST"; then
              ZIP="$z"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "::error::No Gradle wrapper found in repository or ZIP."
            exit 1
          fi

          mkdir -p _project
          unzip -q -o "$ZIP" -d _project

          GW="$(find _project -maxdepth 4 -type f -name gradlew | head -n 1)"

          if [ -z "$GW" ]; then
            echo "::error::gradlew not found after extraction."
            exit 1
          fi

          echo "dir=$(dirname "$GW")" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-ai-studio-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
